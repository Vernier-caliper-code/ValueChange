## 先找到真实的问题

“做一个 AI 助手”不是需求，它只是一个方向。更好的开始，是观察自己或身边的人，在哪些环节反复消耗时间。

- 每周都要整理会议纪要
- 需要在大量文档里反复查找答案
- 写完代码后，总要重复整理变更说明

## 先验证闭环，再选择技术

**先让价值发生，再让系统变得复杂。**
