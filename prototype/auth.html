<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 / 注册｜ValuePass</title><link rel="icon" href="/assets/favicon.ico"><link rel="stylesheet" href="/assets/style.css"></head><body><div data-site-header></div><main id="main" class="auth-page"><section class="auth-shell" aria-labelledby="auth-title"><div class="auth-brand"><img src="/assets/icon.png" alt="ValuePass 标志"><h1 id="auth-title">欢迎回来</h1><p id="auth-description">登录 ValuePass，继续你的探索。</p></div><div class="auth-tabs" role="tablist" aria-label="登录或注册"><button class="auth-tab active" type="button" role="tab" aria-selected="true" data-auth-mode="login">登录</button><button class="auth-tab" type="button" role="tab" aria-selected="false" data-auth-mode="register">注册</button></div><form id="auth-form" novalidate><div class="form-group"><label for="username">账号</label><input class="form-control" id="username" name="username" autocomplete="username" placeholder="请输入你的账号" required></div><div class="form-group"><label for="password">密码</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" placeholder="至少 8 位字符" required minlength="8"><div class="form-hint">密码至少需要 8 位字符</div></div><div class="form-group" id="confirm-group" hidden><label for="confirm-password">确认密码</label><input class="form-control" id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" placeholder="请再次输入密码"></div><p class="form-error" id="auth-error" role="alert"></p><button class="button auth-submit" id="auth-submit" type="submit">登录</button></form><p class="auth-footnote" id="auth-switch-copy">还没有账号？<a href="#" data-switch-register>立即注册</a></p><div class="auth-privacy">原型仅演示交互，不会保存或提交你的账号信息。<br>第一版登录不附带额外权益，全站内容无需登录即可浏览。</div><a class="auth-back" href="/">← 返回首页继续浏览</a></section></main><div data-site-footer></div><script src="/assets/app.js"></script></body></html>
