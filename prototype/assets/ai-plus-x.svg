<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title"><title id="title">AI 与行业结合的思考框架</title><rect width="900" height="620" rx="36" fill="#eef5ed"/><g font-family="Arial, sans-serif"><text x="60" y="78" font-size="18" letter-spacing="3" fill="#3b7652">AI + X / PERSPECTIVE</text><text x="60" y="128" font-size="30" font-weight="700" fill="#254431">从工作出发，而不是从技术出发</text><circle cx="450" cy="355" r="108" fill="#fff" stroke="#a4c9ac" stroke-width="2"/><circle cx="450" cy="355" r="165" fill="none" stroke="#a4c9ac" stroke-dasharray="4 8"/><g fill="#fff" stroke="#a4c9ac" stroke-width="2"><rect x="65" y="220" width="180" height="88" rx="16"/><rect x="655" y="220" width="180" height="88" rx="16"/><rect x="65" y="425" width="180" height="88" rx="16"/><rect x="655" y="425" width="180" height="88" rx="16"/></g><g fill="#254431" font-size="23" text-anchor="middle"><text x="450" y="345" font-weight="700">真实工作</text><text x="450" y="380" font-size="16" fill="#648471">重复 · 判断 · 协作</text><text x="155" y="272">行业经验</text><text x="745" y="272">业务流程</text><text x="155" y="478">人的价值</text><text x="745" y="478">AI 的能力</text></g><text x="60" y="576" fill="#648471" font-size="16">先找到值得改善的一件事，再选择合适的技术。</text></g></svg>
